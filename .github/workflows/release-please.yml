name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          package-name: "@hybridlabor-api/bdb-os-remote"

      # The following steps run only if a new release was created by merging the Release Please PR
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - name: Check if version already published
        id: check_version
        if: ${{ steps.release.outputs.release_created }}
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view $(node -p "require('./package.json').name") version 2>/dev/null || echo "none")
          if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
            echo "Already published $LOCAL_VER. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New version $LOCAL_VER detected (remote is $REMOTE_VER). Proceeding to publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --access public
        if: ${{ steps.release.outputs.release_created && steps.check_version.outputs.skip != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
