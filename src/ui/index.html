<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BDB Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: transparent;
      user-select: none;
      -webkit-app-region: drag;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .non-draggable {
      -webkit-app-region: no-drag;
    }
    .frosted-glass {
      background: rgba(18, 14, 28, 0.78);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }
    .menu-row {
      transition: background-color 0.15s ease;
    }
    .menu-row:hover {
      background-color: rgba(168, 85, 247, 0.12);
    }
    .menu-row:active {
      background-color: rgba(168, 85, 247, 0.20);
    }
  </style>
</head>
<body class="text-white bg-transparent h-screen w-screen overflow-hidden m-0 p-0">
  <div class="frosted-glass rounded-2xl border border-purple-500/20 shadow-2xl w-full h-full flex flex-col overflow-hidden">
    
    
    <!-- Update Banner -->
    <div id="update-banner" class="hidden non-draggable mx-3 mt-3 mb-1 p-2 bg-purple-500/20 border border-purple-500/40 rounded-lg text-sm text-center cursor-pointer hover:bg-purple-500/30 transition-colors">
        ✨ Update <span id="update-version" class="font-bold"></span> verfügbar
    </div>

    <!-- 1. Header (Tailscale style with switch on right) -->
    <div class="px-4 py-3 border-b border-white/5 flex justify-between items-center non-draggable">
      <div class="flex flex-col">
        <span class="font-semibold text-sm tracking-tight text-white flex items-center gap-1.5">
          <span id="status-indicator" class="w-2 h-2 rounded-full bg-purple-400 shadow-[0_0_8px_rgba(192,132,252,0.8)]"></span>
          BDB CONNECT
        </span>
        <span id="status-text" class="text-[11px] text-purple-300/70 font-normal">Connected • Tailscale Mesh</span>
      </div>
      <button id="toggle-btn" class="relative inline-flex h-5 w-10 items-center rounded-full bg-purple-600 transition-colors focus:outline-none shadow-sm">
        <span id="toggle-dot" class="inline-block h-3.5 w-3.5 transform rounded-full bg-white transition-transform translate-x-5 shadow-sm"></span>
      </button>
    </div>

    <!-- 2. Device Identity Row (Tailscale Account Style) -->
    <div class="px-4 py-2.5 border-b border-white/5 flex items-center justify-between menu-row non-draggable cursor-pointer">
      <div class="flex items-center space-x-2.5 overflow-hidden">
        <div class="w-7 h-7 rounded-full bg-purple-900/40 border border-purple-500/30 flex items-center justify-center text-purple-300 shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
          </svg>
        </div>
        <div class="flex flex-col min-w-0">
          <span class="text-xs font-medium text-gray-200 truncate">This Workstation</span>
          <span class="text-[11px] font-mono text-purple-300/80">100.123.207.82</span>
        </div>
      </div>
      <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </div>

    <!-- 3. Navigation / Status Rows -->
    <div class="py-1 border-b border-white/5 non-draggable">
      <div class="px-4 py-2 flex items-center justify-between menu-row cursor-pointer text-xs text-gray-200">
        <span>Inbound Agents (AGY, Codex, Claude)</span>
        <span class="text-[10px] bg-purple-500/20 text-purple-300 px-1.5 py-0.5 rounded border border-purple-500/30">Ready</span>
      </div>
      <div class="px-4 py-2 flex items-center justify-between menu-row cursor-pointer text-xs text-gray-200">
        <span>Active Workspace</span>
        <span class="text-[10px] text-gray-400 truncate max-w-[120px]">~/bdb-dev</span>
      </div>
    </div>

    <!-- 4. Quick Remote Dispatch -->
    <div class="px-4 py-2.5 border-b border-white/5 non-draggable">
      <div class="flex justify-between items-center mb-1">
        <span class="text-[10px] uppercase tracking-wider text-purple-300/60 font-semibold">Remote Dispatch</span>
      </div>
      <input type="text" placeholder="Push task to tailnet..." class="w-full bg-black/40 border border-purple-500/20 rounded-lg px-2.5 py-1.5 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-purple-400 focus:bg-black/60 transition-colors">
    </div>

    <!-- 5. Actions & Tailscale-style Menu Footer -->
    <div class="py-1 mt-auto non-draggable">
      <div id="open-web-ui-btn" class="px-4 py-2 flex items-center justify-between menu-row cursor-pointer text-xs text-purple-200 font-medium">
        <div class="flex items-center space-x-2">
          <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
          </svg>
          <span>Open Agent Workspace Web UI</span>
        </div>
      </div>

      <div class="px-4 py-2 flex items-center justify-between menu-row cursor-pointer text-xs text-gray-300">
        <span>Settings...</span>
        <span class="text-[11px] text-gray-500 font-mono">⌘ ,</span>
      </div>

      <div id="quit-btn" class="px-4 py-2 flex items-center justify-between menu-row cursor-pointer text-xs text-gray-300 hover:text-red-300">
        <span>Quit BDB CONNECT</span>
        <span class="text-[11px] text-gray-500 font-mono">⌘ Q</span>
      </div>
    </div>

  </div>

  <script>
    const toggleBtn = document.getElementById('toggle-btn');
    const toggleDot = document.getElementById('toggle-dot');
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');
    const openWebUiBtn = document.getElementById('open-web-ui-btn');
    const quitBtn = document.getElementById('quit-btn');
    
    let isServerRunning = true;

    quitBtn.addEventListener('click', () => {
      window.electron.send('quit-app');
    });

    toggleBtn.addEventListener('click', () => {
      isServerRunning = !isServerRunning;
      updateToggleUI();
      window.electron.send('toggle-server', isServerRunning);
    });

    openWebUiBtn.addEventListener('click', () => {
      window.electron.send('open-web-ui', 'http://127.0.0.1:8000');
    });

    function updateToggleUI() {
      if (isServerRunning) {
        toggleBtn.classList.remove('bg-gray-700');
        toggleBtn.classList.add('bg-purple-600');
        toggleDot.classList.remove('translate-x-1');
        toggleDot.classList.add('translate-x-5');
        
        statusIndicator.className = 'w-2 h-2 rounded-full bg-purple-400 shadow-[0_0_8px_rgba(192,132,252,0.8)]';
        statusText.textContent = 'Connected • Tailscale Mesh';
        statusText.className = 'text-[11px] text-purple-300/70 font-normal';
      } else {
        toggleBtn.classList.add('bg-gray-700');
        toggleBtn.classList.remove('bg-purple-600');
        toggleDot.classList.add('translate-x-1');
        toggleDot.classList.remove('translate-x-5');
        
        statusIndicator.className = 'w-2 h-2 rounded-full bg-gray-500';
        statusText.textContent = 'Standby • Server Stopped';
        statusText.className = 'text-[11px] text-gray-400 font-normal';
      }
    }

    window.electron.on('server-status', (event, data) => {
      if (data.status === 'running') {
        isServerRunning = true;
        updateToggleUI();
      } else if (data.status === 'stopped' || data.status === 'error') {
        isServerRunning = false;
        updateToggleUI();
      }
    });
  </script>
</body>
</html>
