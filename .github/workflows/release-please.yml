name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          package-name: "@hybridlabor-api/bdb-os-remote"

      # Publishing no longer depends on release_created: when the publish step failed once (expired token), the
      # release already exists and a rerun reports no new release. The version check below decides instead.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Check if version already published
        id: check_version
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view $(node -p "require('./package.json').name") version 2>/dev/null || echo "none")
          if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
            echo "Already published $LOCAL_VER. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New version $LOCAL_VER detected (remote is $REMOTE_VER). Proceeding to publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # package.json only changes version through the merged release PR, so this publishes exactly the released version.
      - run: npm publish --access public
        if: ${{ steps.check_version.outputs.skip != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
